<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            position: relative; /* Essential for top-right positioning */
        }

        /* Top Right Summation Badge */
        .summary-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--primary), #1d4ed8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-align: right;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }

        .summary-badge span {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            opacity: 0.9;
            letter-spacing: 0.05em;
        }

        .summary-badge #totalAmount {
            font-size: 1.5rem;
            font-weight: 700;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
            color: var(--text);
        }

        /* Form Layout */
        .entry-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
        }

        input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-end;
            height: 42px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Data Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top-Right Summation Structure -->
    <div class="summary-badge">
        <span>Total Sum</span>
        <div id="totalAmount">\$0.00</div>
    </div>

    <h2>Add New Entry</h2>

    <!-- Interactive Data Entry Form -->
    <form id="trackerForm" class="entry-form">
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g., Office supplies" required>
        </div>
        <div class="form-group">
            <label for="amount">Amount (\$)</label>
            <input type="number" id="amount" step="0.01" placeholder="0.00" required>
        </div>
        <button type="submit">Add Entry</button>
    </form>

    <!-- Table to View Appended Records -->
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dynamic rows get placed here -->
        </tbody>
    </table>
</div>

<script>
    const form = document.getElementById('trackerForm');
    const tableBody = document.getElementById('tableBody');
    const totalAmountDisplay = document.getElementById('totalAmount');
    
    let globalTotal = 0;

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // 1. Capture Form Values
        const dateValue = document.getElementById('date').value;
        const descValue = document.getElementById('description').value;
        const amountValue = parseFloat(document.getElementById('amount').value);

        // 2. Generate a New Table Row
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${dateValue}</td>
            <td>${descValue}</td>
            <td>$${amountValue.toFixed(2)}</td>
        `;
        tableBody.appendChild(row);

        // 3. Update the Top-Right Summation
        globalTotal += amountValue;
        totalAmountDisplay.textContent = `$${globalTotal.toFixed(2)}`;

        // 4. Reset Input Window
        form.reset();
    });
</script>

</body>
</html>
